{% extends "base.html" %}
{% block title %}Log in | Secure ATM{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="card">
        <h1>Log in</h1>
        <p class="muted">Access your account and ledger.</p>

        <form action="/login" method="POST" class="form">
            <label>Email</label>
            <input type="email" name="email" required autofocus>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <p class="muted" style="margin-top:18px;">New here? <a href="/register">Open an account</a></p>
    </div>
</div>
{% endblock %}
